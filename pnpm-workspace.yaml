packages:
  - '.'
  - 'packages/*'

allowBuilds:
  '@datadog/native-appsec': false
  '@datadog/native-iast-taint-tracking': false
  '@datadog/native-metrics': false
  '@datadog/pprof': false
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  core-js: true
  cpu-features: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  protobufjs: true
  ssh2: false
  unrs-resolver: false
  vue-demi: true

catalog:
  # AWS SDK packages
  '@aws-sdk/client-cloudwatch': ^3.715.0
  '@aws-sdk/client-eventbridge': ^3.715.0
  '@aws-sdk/client-lambda': ^3.715.0
  '@aws-sdk/client-s3': ^3.715.0
  '@aws-sdk/client-sesv2': ^3.715.0
  '@aws-sdk/credential-providers': ^3.715.0
  '@aws-sdk/lib-storage': ^3.715.0
  '@aws-sdk/s3-request-presigner': ^3.715.0
  
  # Development tools
  eslint: ^9.20.0
  typescript: ^7.0.2
